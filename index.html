<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispensary Management Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-sidebar: #0f172a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #22c55e;
            --success-bg: #052e16;
            --warning: #f59e0b;
            --warning-bg: #451a03;
            --danger: #ef4444;
            --danger-bg: #450a0a;
            --border: #334155;
            --input-bg: #0f172a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── SIDEBAR ─────────────────────────── */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 10;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding: 0 8px;
        }
        .sidebar .logo .icon {
            width: 42px;
            height: 42px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #0f172a;
            font-weight: 700;
        }
        .sidebar .logo h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .sidebar .logo span {
            font-size: 11px;
            color: var(--accent);
            display: block;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            position: relative;
        }
        .nav-item:hover {
            background: #1e293b;
            color: var(--text-primary);
        }
        .nav-item.active {
            background: #1e293b;
            color: var(--accent);
            font-weight: 600;
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: var(--accent);
            border-radius: 0 4px 4px 0;
        }
        .nav-item .emoji {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        .nav-badge {
            margin-left: auto;
            background: var(--accent);
            color: #0f172a;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            min-width: 22px;
            text-align: center;
        }
        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 8px;
        }
        .sidebar-footer .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: var(--radius-sm);
        }
        .sidebar-footer .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .sidebar-footer .name {
            font-size: 13px;
            font-weight: 500;
        }
        .sidebar-footer .role {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── MAIN CONTENT ────────────────────── */
        .main-content {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            max-height: 100vh;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .page-header h2 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .page-header .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 2px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--accent);
            color: #0f172a;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
        }
        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: #1e293b;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 6px;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 10px;
            border-radius: 5px;
        }

        /* ── STAT CARDS ──────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .stat-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .stat-card .stat-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .stat-card .stat-value {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .stat-card .stat-label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 2px;
        }
        .stat-card.accent {
            border-left: 3px solid var(--accent);
        }
        .stat-card.success {
            border-left: 3px solid var(--success);
        }
        .stat-card.warning {
            border-left: 3px solid var(--warning);
        }
        .stat-card.danger {
            border-left: 3px solid var(--danger);
        }

        /* ── TABLE ───────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-header h3 {
            font-size: 16px;
            font-weight: 600;
        }
        .card-body {
            padding: 0;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            background: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        table td {
            padding: 13px 16px;
            border-bottom: 1px solid #1e293b;
            white-space: nowrap;
        }
        table tbody tr {
            transition: var(--transition);
        }
        table tbody tr:hover {
            background: #1a2538;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .status-active {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-pending {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .status-completed {
            background: #0c1929;
            color: var(--accent);
        }
        .status-low {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 50px;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* ── MODAL ───────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 30px;
            width: 90%;
            max-width: 550px;
            box-shadow: var(--shadow-lg);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-size: 19px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        /* ── SEARCH ──────────────────────────── */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 14px;
            transition: var(--transition);
        }
        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.08);
        }
        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 180px;
        }
        .search-bar .search-icon {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ── TOAST ───────────────────────────── */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 13px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            animation: slideIn 0.3s ease;
            box-shadow: var(--shadow-lg);
            max-width: 360px;
        }
        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .toast-success {
            background: #15803d;
        }
        .toast-error {
            background: #991b1b;
        }
        .toast-info {
            background: #1d4ed8;
        }

        /* ── SETTINGS PANEL STYLES ──────────── */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .setting-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .setting-card h4 {
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* ── RESPONSIVE ──────────────────────── */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 12px;
                gap: 6px;
                align-items: center;
                justify-content: center;
            }
            .sidebar .logo {
                margin-bottom: 0;
            }
            .nav-section {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 2px;
            }
            .nav-item {
                padding: 8px 10px;
                font-size: 12px;
                gap: 6px;
            }
            .nav-item .emoji {
                font-size: 14px;
            }
            .nav-item.active::before {
                display: none;
            }
            .sidebar-footer {
                display: none;
            }
            .main-content {
                padding: 16px;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-card {
                padding: 14px 16px;
            }
            .stat-card .stat-value {
                font-size: 24px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
            .modal {
                padding: 18px;
                width: 95%;
            }
        }
    </style>
</head>
<body>

    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="sidebar">
        <div class="logo">
            <div class="icon">💊</div>
            <div>
                <h1>MediDispense</h1>
                <span>Management System</span>
            </div>
        </div>
        <nav class="nav-section">
            <button class="nav-item active" data-page="dashboard">
                <span class="emoji">📊</span> Dashboard
                <span class="nav-badge" id="totalPatientsBadge">0</span>
            </button>
            <button class="nav-item" data-page="patients">
                <span class="emoji">👥</span> Patients
            </button>
            <button class="nav-item" data-page="prescriptions">
                <span class="emoji">📋</span> Prescriptions
            </button>
            <button class="nav-item" data-page="inventory">
                <span class="emoji">📦</span> Inventory
                <span class="nav-badge" id="lowStockBadge" style="background:#ef4444;">0</span>
            </button>
            <button class="nav-item" data-page="settings">
                <span class="emoji">⚙️</span> Settings
            </button>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar">AK</div>
                <div>
                    <div class="name">Admin Khan</div>
                    <div class="role">Dispensary Manager</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- ═══════════ MAIN CONTENT ═══════════ -->
    <main class="main-content" id="mainContent">
        <!-- Dynamically rendered by JS -->
    </main>

    <!-- ═══════════ MODAL CONTAINER ═══════════ -->
    <div id="modalContainer"></div>

    <!-- ═══════════ TOAST CONTAINER ═══════════ -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // ──────────────────────────────────────
            // DATA STORE (localStorage)
            // ──────────────────────────────────────
            const STORAGE_KEYS = {
                patients: 'dispensary_patients',
                prescriptions: 'dispensary_prescriptions',
                inventory: 'dispensary_inventory',
                settings: 'dispensary_settings',
            };

            function getData(key, fallback) {
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : fallback;
                } catch {
                    return fallback;
                }
            }

            function setData(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
            }

            // Default inventory items
            const defaultInventory = [
                { id: 'inv1', name: 'Paracetamol 500mg', category: 'Pain Relief', stock: 245, unit: 'tablets',
                    reorderLevel: 50, price: 2.50 },
                { id: 'inv2', name: 'Amoxicillin 250mg', category: 'Antibiotic', stock: 18, unit: 'capsules',
                    reorderLevel: 30, price: 8.00 },
                { id: 'inv3', name: 'Ibuprofen 400mg', category: 'Pain Relief', stock: 120, unit: 'tablets',
                    reorderLevel: 40, price: 3.25 },
                { id: 'inv4', name: 'Cetirizine 10mg', category: 'Antihistamine', stock: 5, unit: 'tablets',
                    reorderLevel: 25, price: 4.00 },
                { id: 'inv5', name: 'Omeprazole 20mg', category: 'Antacid', stock: 80, unit: 'capsules',
                    reorderLevel: 30, price: 6.50 },
                { id: 'inv6', name: 'Metformin 500mg', category: 'Diabetes', stock: 200, unit: 'tablets',
                    reorderLevel: 50, price: 3.75 },
                { id: 'inv7', name: 'Salbutamol Inhaler', category: 'Respiratory', stock: 12, unit: 'inhalers',
                    reorderLevel: 15, price: 45.00 },
                { id: 'inv8', name: 'Aspirin 75mg', category: 'Cardiovascular', stock: 90, unit: 'tablets',
                    reorderLevel: 35, price: 1.80 },
            ];

            // Default patients
            const defaultPatients = [
                { id: 'p1', name: 'Ahmed Ali', age: 34, gender: 'Male', phone: '0300-1234567',
                    address: 'Karachi, Pakistan', registeredAt: '2026-01-15', condition: 'Hypertension' },
                { id: 'p2', name: 'Fatima Bibi', age: 28, gender: 'Female', phone: '0301-9876543',
                    address: 'Lahore, Pakistan', registeredAt: '2026-02-20', condition: 'Diabetes Type 2' },
                { id: 'p3', name: 'Muhammad Usman', age: 45, gender: 'Male', phone: '0322-5551234',
                    address: 'Islamabad, Pakistan', registeredAt: '2026-03-10', condition: 'Asthma' },
            ];

            // Default prescriptions
            const defaultPrescriptions = [
                { id: 'rx1', patientId: 'p1', patientName: 'Ahmed Ali', medicine: 'Paracetamol 500mg',
                    dosage: '1 tablet twice daily', quantity: 20, status: 'Active', date: '2026-04-20',
                    notes: 'Take after meals' },
                { id: 'rx2', patientId: 'p2', patientName: 'Fatima Bibi', medicine: 'Metformin 500mg',
                    dosage: '1 tablet daily', quantity: 30, status: 'Active', date: '2026-04-22',
                    notes: 'Monitor blood sugar' },
                { id: 'rx3', patientId: 'p3', patientName: 'Muhammad Usman', medicine: 'Salbutamol Inhaler',
                    dosage: '2 puffs as needed', quantity: 1, status: 'Completed', date: '2026-04-18', notes: '' },
            ];

            let patients = getData(STORAGE_KEYS.patients, defaultPatients);
            let prescriptions = getData(STORAGE_KEYS.prescriptions, defaultPrescriptions);
            let inventory = getData(STORAGE_KEYS.inventory, defaultInventory);
            let settings = getData(STORAGE_KEYS.settings, { dispensaryName: 'MediDispense Clinic',
                address: 'Main Street, Pakistan', phone: '051-1234567' });

            function saveAll() {
                setData(STORAGE_KEYS.patients, patients);
                setData(STORAGE_KEYS.prescriptions, prescriptions);
                setData(STORAGE_KEYS.inventory, inventory);
                setData(STORAGE_KEYS.settings, settings);
            }

            // ──────────────────────────────────────
            // UTILS
            // ──────────────────────────────────────
            function generateId(prefix) {
                return prefix + Date.now() + Math.random().toString(36).substring(2, 6);
            }

            function formatDate(dateStr) {
                if (!dateStr) return '—';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            }

            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 2800);
            }

            // ──────────────────────────────────────
            // NAVIGATION
            // ──────────────────────────────────────
            let currentPage = 'dashboard';

            function navigateTo(page) {
                currentPage = page;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const navItem = document.querySelector(`[data-page="${page}"]`);
                if (navItem) navItem.classList.add('active');
                renderPage();
                updateBadges();
            }

            function updateBadges() {
                const totalP = patients.length;
                const lowStock = inventory.filter(i => i.stock <= i.reorderLevel).length;
                document.getElementById('totalPatientsBadge').textContent = totalP;
                document.getElementById('lowStockBadge').textContent = lowStock;
                document.getElementById('lowStockBadge').style.display = lowStock > 0 ? 'inline' : 'none';
            }

            // ──────────────────────────────────────
            // RENDER ENGINE
            // ──────────────────────────────────────
            function renderPage() {
                const container = document.getElementById('mainContent');
                switch (currentPage) {
                    case 'dashboard':
                        container.innerHTML = renderDashboard();
                        break;
                    case 'patients':
                        container.innerHTML = renderPatientsPage();
                        break;
                    case 'prescriptions':
                        container.innerHTML = renderPrescriptionsPage();
                        break;
                    case 'inventory':
                        container.innerHTML = renderInventoryPage();
                        break;
                    case 'settings':
                        container.innerHTML = renderSettingsPage();
                        break;
                    default:
                        container.innerHTML = renderDashboard();
                }
                attachEventListeners();
            }

            // ── DASHBOARD ──────────────────────────
            function renderDashboard() {
                const totalPatients = patients.length;
                const activePrescriptions = prescriptions.filter(p => p.status === 'Active').length;
                const totalInventory = inventory.reduce((sum, i) => sum + i.stock, 0);
                const lowStockCount = inventory.filter(i => i.stock <= i.reorderLevel).length;

                return `
                <div class="page-header">
                    <div>
                        <h2>📊 Dashboard</h2>
                        <p class="subtitle">Welcome back, Admin. Here's your dispensary overview.</p>
                    </div>
                    <button class="btn btn-primary" onclick="window._navigateTo('patients')">+ New Patient</button>
                </div>
                <div class="stats-row">
                    <div class="stat-card accent">
                        <div class="stat-icon">👥</div>
                        <div class="stat-value">${totalPatients}</div>
                        <div class="stat-label">Total Patients</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-icon">📋</div>
                        <div class="stat-value">${activePrescriptions}</div>
                        <div class="stat-label">Active Prescriptions</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-icon">📦</div>
                        <div class="stat-value">${totalInventory}</div>
                        <div class="stat-label">Items in Stock</div>
                    </div>
                    <div class="stat-card danger">
                        <div class="stat-icon">⚠️</div>
                        <div class="stat-value">${lowStockCount}</div>
                        <div class="stat-label">Low Stock Alerts</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Recent Patients</h3></div>
                    <div class="card-body">
                        ${patients.length === 0 ? '<div class="empty-state"><div class="empty-icon">👤</div><p>No patients registered yet.</p></div>' : `
                        <table>
                            <thead><tr><th>Name</th><th>Age</th><th>Phone</th><th>Condition</th><th>Registered</th></tr></thead>
                            <tbody>
                                ${patients.slice(-5).reverse().map(p => `
                                <tr>
                                    <td><strong>${escapeHTML(p.name)}</strong></td>
                                    <td>${p.age}</td>
                                    <td>${escapeHTML(p.phone)}</td>
                                    <td>${escapeHTML(p.condition || '—')}</td>
                                    <td>${formatDate(p.registeredAt)}</td>
                                </tr>`).join('')}
                            </tbody>
                        </table>`}
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Low Stock Items</h3></div>
                    <div class="card-body">
                        ${lowStockCount === 0 ? '<div class="empty-state"><div class="empty-icon">✅</div><p>All items are sufficiently stocked.</p></div>' : `
                        <table>
                            <thead><tr><th>Medicine</th><th>Stock</th><th>Reorder Level</th><th>Status</th></tr></thead>
                            <tbody>
                                ${inventory.filter(i=>i.stock<=i.reorderLevel).map(i=>`
                                <tr>
                                    <td><strong>${escapeHTML(i.name)}</strong></td>
                                    <td>${i.stock} ${i.unit}</td>
                                    <td>${i.reorderLevel} ${i.unit}</td>
                                    <td><span class="status-badge status-low">Low Stock</span></td>
                                </tr>`).join('')}
                            </tbody>
                        </table>`}
                    </div>
                </div>`;
            }

            // ── PATIENTS PAGE ─────────────────────
            function renderPatientsPage() {
                return `
                <div class="page-header">
                    <div>
                        <h2>👥 Patients</h2>
                        <p class="subtitle">Manage patient records</p>
                    </div>
                    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                        <div class="search-bar">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="patientSearch" placeholder="Search patients..." oninput="window._filterPatients()">
                        </div>
                        <button class="btn btn-primary" onclick="window._openPatientModal()">+ Add Patient</button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body" id="patientsTableContainer">
                        ${renderPatientsTable(patients)}
                    </div>
                </div>`;
            }

            function renderPatientsTable(list) {
                if (list.length === 0) return '<div class="empty-state"><div class="empty-icon">👤</div><p>No patients found.</p></div>';
                return `
                <table>
                    <thead><tr><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Condition</th><th>Registered</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${list.map(p => `
                        <tr>
                            <td><strong>${escapeHTML(p.name)}</strong></td>
                            <td>${p.age}</td>
                            <td>${p.gender}</td>
                            <td>${escapeHTML(p.phone)}</td>
                            <td>${escapeHTML(p.condition || '—')}</td>
                            <td>${formatDate(p.registeredAt)}</td>
                            <td>
                                <button class="btn btn-secondary btn-xs" onclick="window._openPatientModal('${p.id}')">✏️</button>
                                <button class="btn btn-danger btn-xs" onclick="window._deletePatient('${p.id}')">🗑️</button>
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>`;
            }

            window._filterPatients = function() {
                const query = document.getElementById('patientSearch')?.value?.toLowerCase() || '';
                const filtered = patients.filter(p => p.name.toLowerCase().includes(query) || p.phone.includes(
                query));
                const container = document.getElementById('patientsTableContainer');
                if (container) container.innerHTML = renderPatientsTable(filtered);
            };

            window._openPatientModal = function(patientId = null) {
                const patient = patientId ? patients.find(p => p.id === patientId) : null;
                const modalHTML = `
                <div class="modal-overlay" id="patientModalOverlay" onclick="if(event.target===this)window._closeModal()">
                    <div class="modal">
                        <h3>${patient ? 'Edit Patient' : 'Add New Patient'}</h3>
                        <form id="patientForm" onsubmit="window._savePatient(event, '${patientId || ''}')">
                            <div class="form-row">
                                <div class="form-group"><label>Full Name *</label><input type="text" id="patName" value="${escapeHTML(patient?.name || '')}" required></div>
                                <div class="form-group"><label>Age *</label><input type="number" id="patAge" value="${patient?.age || ''}" min="0" max="120" required></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>Gender</label><select id="patGender"><option value="Male" ${patient?.gender==='Male'?'selected':''}>Male</option><option value="Female" ${patient?.gender==='Female'?'selected':''}>Female</option><option value="Other" ${patient?.gender==='Other'?'selected':''}>Other</option></select></div>
                                <div class="form-group"><label>Phone *</label><input type="text" id="patPhone" value="${escapeHTML(patient?.phone || '')}" required></div>
                            </div>
                            <div class="form-group"><label>Address</label><input type="text" id="patAddress" value="${escapeHTML(patient?.address || '')}"></div>
                            <div class="form-group"><label>Medical Condition</label><input type="text" id="patCondition" value="${escapeHTML(patient?.condition || '')}"></div>
                            <div class="modal-actions">
                                <button type="button" class="btn btn-secondary" onclick="window._closeModal()">Cancel</button>
                                <button type="submit" class="btn btn-primary">${patient ? 'Update' : 'Save'} Patient</button>
                            </div>
                        </form>
                    </div>
                </div>`;
                document.getElementById('modalContainer').innerHTML = modalHTML;
            };

            window._savePatient = function(event, existingId) {
                event.preventDefault();
                const name = document.getElementById('patName').value.trim();
                const age = parseInt(document.getElementById('patAge').value);
                const gender = document.getElementById('patGender').value;
                const phone = document.getElementById('patPhone').value.trim();
                const address = document.getElementById('patAddress').value.trim();
                const condition = document.getElementById('patCondition').value.trim();

                if (!name || !age || !phone) {
                    showToast('Please fill all required fields.', 'error');
                    return;
                }
                if (existingId) {
                    const idx = patients.findIndex(p => p.id === existingId);
                    if (idx >= 0) {
                        patients[idx] = { ...patients[idx], name, age, gender, phone, address, condition };
                        showToast('Patient updated successfully!', 'success');
                    }
                } else {
                    patients.push({ id: generateId('p'), name, age, gender, phone, address, condition,
                        registeredAt: new Date().toISOString().split('T')[0] });
                    showToast('Patient added successfully!', 'success');
                }
                saveAll();
                window._closeModal();
                renderPage();
                updateBadges();
            };

            window._deletePatient = function(patientId) {
                if (!confirm('Delete this patient and all their prescriptions?')) return;
                patients = patients.filter(p => p.id !== patientId);
                prescriptions = prescriptions.filter(rx => rx.patientId !== patientId);
                saveAll();
                renderPage();
                updateBadges();
                showToast('Patient deleted.', 'info');
            };

            // ── PRESCRIPTIONS PAGE ─────────────────
            function renderPrescriptionsPage() {
                return `
                <div class="page-header">
                    <div>
                        <h2>📋 Prescriptions</h2>
                        <p class="subtitle">Track dispensed medications</p>
                    </div>
                    <button class="btn btn-primary" onclick="window._openPrescriptionModal()">+ New Prescription</button>
                </div>
                <div class="card">
                    <div class="card-body">
                        ${prescriptions.length === 0 ? '<div class="empty-state"><div class="empty-icon">📋</div><p>No prescriptions yet.</p></div>' : `
                        <table>
                            <thead><tr><th>Patient</th><th>Medicine</th><th>Dosage</th><th>Qty</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${prescriptions.slice().reverse().map(rx => `
                                <tr>
                                    <td><strong>${escapeHTML(rx.patientName)}</strong></td>
                                    <td>${escapeHTML(rx.medicine)}</td>
                                    <td>${escapeHTML(rx.dosage)}</td>
                                    <td>${rx.quantity}</td>
                                    <td><span class="status-badge status-${rx.status.toLowerCase()}">${rx.status}</span></td>
                                    <td>${formatDate(rx.date)}</td>
                                    <td>
                                        <button class="btn btn-secondary btn-xs" onclick="window._openPrescriptionModal('${rx.id}')">✏️</button>
                                        <button class="btn btn-danger btn-xs" onclick="window._deletePrescription('${rx.id}')">🗑️</button>
                                    </td>
                                </tr>`).join('')}
                            </tbody>
                        </table>`}
                    </div>
                </div>`;
            }

            window._openPrescriptionModal = function(rxId = null) {
                const rx = rxId ? prescriptions.find(r => r.id === rxId) : null;
                const patientOptions = patients.map(p =>
                    `<option value="${p.id}" ${rx?.patientId===p.id?'selected':''}>${escapeHTML(p.name)}</option>`
                    ).join('');
                const medicineOptions = inventory.map(i =>
                    `<option value="${escapeHTML(i.name)}" ${rx?.medicine===i.name?'selected':''}>${escapeHTML(i.name)} (${i.stock} ${i.unit})</option>`
                    ).join('');
                const modalHTML = `
                <div class="modal-overlay" id="rxModalOverlay" onclick="if(event.target===this)window._closeModal()">
                    <div class="modal">
                        <h3>${rx ? 'Edit Prescription' : 'New Prescription'}</h3>
                        <form id="rxForm" onsubmit="window._savePrescription(event, '${rxId || ''}')">
                            <div class="form-group"><label>Patient *</label><select id="rxPatient" required><option value="">-- Select Patient --</option>${patientOptions}</select></div>
                            <div class="form-group"><label>Medicine *</label><select id="rxMedicine" required><option value="">-- Select Medicine --</option>${medicineOptions}</select></div>
                            <div class="form-row">
                                <div class="form-group"><label>Dosage *</label><input type="text" id="rxDosage" value="${escapeHTML(rx?.dosage || '')}" placeholder="e.g., 1 tablet twice daily" required></div>
                                <div class="form-group"><label>Quantity *</label><input type="number" id="rxQuantity" value="${rx?.quantity || ''}" min="1" required></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>Status</label><select id="rxStatus"><option value="Active" ${rx?.status==='Active'?'selected':''}>Active</option><option value="Completed" ${rx?.status==='Completed'?'selected':''}>Completed</option><option value="Pending" ${rx?.status==='Pending'?'selected':''}>Pending</option></select></div>
                                <div class="form-group"><label>Date</label><input type="date" id="rxDate" value="${rx?.date || new Date().toISOString().split('T')[0]}"></div>
                            </div>
                            <div class="form-group"><label>Notes</label><textarea id="rxNotes">${escapeHTML(rx?.notes || '')}</textarea></div>
                            <div class="modal-actions">
                                <button type="button" class="btn btn-secondary" onclick="window._closeModal()">Cancel</button>
                                <button type="submit" class="btn btn-primary">${rx ? 'Update' : 'Save'} Prescription</button>
                            </div>
                        </form>
                    </div>
                </div>`;
                document.getElementById('modalContainer').innerHTML = modalHTML;
            };

            window._savePrescription = function(event, existingId) {
                event.preventDefault();
                const patientId = document.getElementById('rxPatient').value;
                const medicine = document.getElementById('rxMedicine').value;
                const dosage = document.getElementById('rxDosage').value.trim();
                const quantity = parseInt(document.getElementById('rxQuantity').value);
                const status = document.getElementById('rxStatus').value;
                const date = document.getElementById('rxDate').value;
                const notes = document.getElementById('rxNotes').value.trim();
                const patient = patients.find(p => p.id === patientId);
                const patientName = patient ? patient.name : 'Unknown';

                if (!patientId || !medicine || !dosage || !quantity) {
                    showToast('Please fill all required fields.', 'error');
                    return;
                }
                // Deduct from inventory
                const invItem = inventory.find(i => i.name === medicine);
                if (invItem && status === 'Active') {
                    if (invItem.stock < quantity) {
                        showToast('Not enough stock! Only ' + invItem.stock + ' ' + invItem.unit + ' available.',
                            'error');
                        return;
                    }
                    if (!existingId) invItem.stock -= quantity;
                }

                if (existingId) {
                    const idx = prescriptions.findIndex(r => r.id === existingId);
                    if (idx >= 0) prescriptions[idx] = { ...prescriptions[idx], patientId, patientName, medicine,
                        dosage, quantity, status, date, notes };
                    showToast('Prescription updated!', 'success');
                } else {
                    prescriptions.push({ id: generateId('rx'), patientId, patientName, medicine, dosage, quantity,
                        status, date, notes });
                    showToast('Prescription added & stock deducted!', 'success');
                }
                saveAll();
                window._closeModal();
                renderPage();
                updateBadges();
            };

            window._deletePrescription = function(rxId) {
                if (!confirm('Delete this prescription?')) return;
                prescriptions = prescriptions.filter(r => r.id !== rxId);
                saveAll();
                renderPage();
                updateBadges();
                showToast('Prescription deleted.', 'info');
            };

            // ── INVENTORY PAGE ─────────────────────
            function renderInventoryPage() {
                return `
                <div class="page-header">
                    <div>
                        <h2>📦 Inventory</h2>
                        <p class="subtitle">Manage medicine stock levels</p>
                    </div>
                    <button class="btn btn-primary" onclick="window._openInventoryModal()">+ Add Medicine</button>
                </div>
                <div class="card">
                    <div class="card-body">
                        ${inventory.length === 0 ? '<div class="empty-state"><div class="empty-icon">📦</div><p>No medicines in inventory.</p></div>' : `
                        <table>
                            <thead><tr><th>Medicine</th><th>Category</th><th>Stock</th><th>Unit</th><th>Reorder Level</th><th>Price (Rs)</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${inventory.map(i => {
                                    const statusClass = i.stock <= i.reorderLevel ? 'status-low' : i.stock <= i.reorderLevel*2 ? 'status-pending' : 'status-active';
                                    const statusText = i.stock <= i.reorderLevel ? 'Low' : i.stock <= i.reorderLevel*2 ? 'Moderate' : 'Good';
                                    return `
                                <tr>
                                    <td><strong>${escapeHTML(i.name)}</strong></td>
                                    <td>${escapeHTML(i.category)}</td>
                                    <td>${i.stock}</td>
                                    <td>${i.unit}</td>
                                    <td>${i.reorderLevel}</td>
                                    <td>Rs. ${i.price.toFixed(2)}</td>
                                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                                    <td>
                                        <button class="btn btn-secondary btn-xs" onclick="window._openInventoryModal('${i.id}')">✏️</button>
                                        <button class="btn btn-danger btn-xs" onclick="window._deleteInventory('${i.id}')">🗑️</button>
                                    </td>
                                </tr>`;
                                }).join('')}
                            </tbody>
                        </table>`}
                    </div>
                </div>`;
            }

            window._openInventoryModal = function(invId = null) {
                const item = invId ? inventory.find(i => i.id === invId) : null;
                const modalHTML = `
                <div class="modal-overlay" id="invModalOverlay" onclick="if(event.target===this)window._closeModal()">
                    <div class="modal">
                        <h3>${item ? 'Edit Medicine' : 'Add Medicine'}</h3>
                        <form id="invForm" onsubmit="window._saveInventory(event, '${invId || ''}')">
                            <div class="form-group"><label>Medicine Name *</label><input type="text" id="invName" value="${escapeHTML(item?.name || '')}" required></div>
                            <div class="form-row">
                                <div class="form-group"><label>Category</label><input type="text" id="invCategory" value="${escapeHTML(item?.category || '')}"></div>
                                <div class="form-group"><label>Unit</label><input type="text" id="invUnit" value="${escapeHTML(item?.unit || 'tablets')}" placeholder="tablets / capsules / bottles"></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>Stock Quantity *</label><input type="number" id="invStock" value="${item?.stock ?? 0}" min="0" required></div>
                                <div class="form-group"><label>Reorder Level</label><input type="number" id="invReorder" value="${item?.reorderLevel ?? 20}" min="1"></div>
                            </div>
                            <div class="form-group"><label>Price per Unit (Rs.)</label><input type="number" id="invPrice" value="${item?.price ?? 0}" min="0" step="0.01"></div>
                            <div class="modal-actions">
                                <button type="button" class="btn btn-secondary" onclick="window._closeModal()">Cancel</button>
                                <button type="submit" class="btn btn-primary">${item ? 'Update' : 'Save'} Medicine</button>
                            </div>
                        </form>
                    </div>
                </div>`;
                document.getElementById('modalContainer').innerHTML = modalHTML;
            };

            window._saveInventory = function(event, existingId) {
                event.preventDefault();
                const name = document.getElementById('invName').value.trim();
                const category = document.getElementById('invCategory').value.trim();
                const unit = document.getElementById('invUnit').value.trim();
                const stock = parseInt(document.getElementById('invStock').value);
                const reorderLevel = parseInt(document.getElementById('invReorder').value);
                const price = parseFloat(document.getElementById('invPrice').value) || 0;

                if (!name) { showToast('Medicine name is required.', 'error'); return; }
                if (existingId) {
                    const idx = inventory.findIndex(i => i.id === existingId);
                    if (idx >= 0) inventory[idx] = { ...inventory[idx], name, category, unit, stock, reorderLevel,
                        price };
                    showToast('Medicine updated!', 'success');
                } else {
                    inventory.push({ id: generateId('inv'), name, category, unit, stock, reorderLevel, price });
                    showToast('Medicine added!', 'success');
                }
                saveAll();
                window._closeModal();
                renderPage();
                updateBadges();
            };

            window._deleteInventory = function(invId) {
                if (!confirm('Delete this medicine from inventory?')) return;
                inventory = inventory.filter(i => i.id !== invId);
                saveAll();
                renderPage();
                updateBadges();
                showToast('Medicine removed from inventory.', 'info');
            };

            // ── SETTINGS PAGE ──────────────────────
            function renderSettingsPage() {
                return `
                <div class="page-header">
                    <div>
                        <h2>⚙️ Settings</h2>
                        <p class="subtitle">Configure your dispensary information</p>
                    </div>
                </div>
                <div class="settings-grid">
                    <div class="setting-card">
                        <h4>🏥 Dispensary Info</h4>
                        <form id="settingsForm" onsubmit="window._saveSettings(event)">
                            <div class="form-group"><label>Dispensary Name</label><input type="text" id="setName" value="${escapeHTML(settings.dispensaryName || '')}"></div>
                            <div class="form-group"><label>Address</label><input type="text" id="setAddress" value="${escapeHTML(settings.address || '')}"></div>
                            <div class="form-group"><label>Phone</label><input type="text" id="setPhone" value="${escapeHTML(settings.phone || '')}"></div>
                            <button type="submit" class="btn btn-primary">Save Settings</button>
                        </form>
                    </div>
                    <div class="setting-card">
                        <h4>🗄️ Data Management</h4>
                        <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">All data is stored in your browser's localStorage.</p>
                        <button class="btn btn-secondary" onclick="window._exportData()" style="margin-bottom:8px;width:100%;">📥 Export All Data (JSON)</button>
                        <button class="btn btn-secondary" onclick="window._importDataPrompt()" style="margin-bottom:8px;width:100%;">📤 Import Data (JSON)</button>
                        <button class="btn btn-danger" onclick="window._resetAllData()" style="width:100%;">⚠️ Reset All Data</button>
                    </div>
                </div>`;
            }

            window._saveSettings = function(event) {
                event.preventDefault();
                settings.dispensaryName = document.getElementById('setName').value.trim();
                settings.address = document.getElementById('setAddress').value.trim();
                settings.phone = document.getElementById('setPhone').value.trim();
                saveAll();
                showToast('Settings saved!', 'success');
            };

            window._exportData = function() {
                const data = { patients, prescriptions, inventory, settings, exportedAt: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dispensary-backup-' + new Date().toISOString().split('T')[0] + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('Data exported successfully!', 'success');
            };

            window._importDataPrompt = function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (data.patients && data.prescriptions && data.inventory) {
                                if (!confirm(
                                        'This will replace all current data. Are you sure?')) return;
                                patients = data.patients;
                                prescriptions = data.prescriptions;
                                inventory = data.inventory;
                                if (data.settings) settings = data.settings;
                                saveAll();
                                renderPage();
                                updateBadges();
                                showToast('Data imported successfully!', 'success');
                            } else {
                                showToast('Invalid backup file format.', 'error');
                            }
                        } catch {
                            showToast('Error parsing JSON file.', 'error');
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            window._resetAllData = function() {
                if (!confirm('⚠️ This will DELETE ALL data permanently. Are you absolutely sure?')) return;
                if (!confirm('Final confirmation: Reset everything to defaults?')) return;
                patients = [...defaultPatients];
                prescriptions = [...defaultPrescriptions];
                inventory = [...defaultInventory];
                settings = { dispensaryName: 'MediDispense Clinic', address: 'Main Street, Pakistan',
                    phone: '051-1234567' };
                saveAll();
                renderPage();
                updateBadges();
                showToast('All data has been reset to defaults.', 'info');
            };

            // ── MODAL CLOSE ────────────────────────
            window._closeModal = function() {
                document.getElementById('modalContainer').innerHTML = '';
            };

            // ── NAVIGATION EXPOSURE ────────────────
            window._navigateTo = navigateTo;

            // ── HELPERS ────────────────────────────
            function escapeHTML(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function attachEventListeners() {
                // Re-attach sidebar nav listeners
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.removeEventListener('click', navHandler);
                    item.addEventListener('click', navHandler);
                });
            }

            function navHandler(e) {
                const page = this.getAttribute('data-page');
                if (page) navigateTo(page);
            }

            // ── INIT ───────────────────────────────
            function init() {
                // Set default data if empty
                if (!localStorage.getItem(STORAGE_KEYS.patients)) setData(STORAGE_KEYS.patients,
                defaultPatients);
                if (!localStorage.getItem(STORAGE_KEYS.prescriptions)) setData(STORAGE_KEYS.prescriptions,
                    defaultPrescriptions);
                if (!localStorage.getItem(STORAGE_KEYS.inventory)) setData(STORAGE_KEYS.inventory, defaultInventory);
                if (!localStorage.getItem(STORAGE_KEYS.settings)) setData(STORAGE_KEYS.settings, { dispensaryName: 'MediDispense Clinic',
                    address: 'Main Street, Pakistan', phone: '051-1234567' });

                patients = getData(STORAGE_KEYS.patients, defaultPatients);
                prescriptions = getData(STORAGE_KEYS.prescriptions, defaultPrescriptions);
                inventory = getData(STORAGE_KEYS.inventory, defaultInventory);
                settings = getData(STORAGE_KEYS.settings, { dispensaryName: 'MediDispense Clinic',
                    address: 'Main Street, Pakistan', phone: '051-1234567' });

                renderPage();
                updateBadges();
                attachEventListeners();
            }

            init();
            console.log('💊 Dispensary Management Dashboard ready!');
            console.log('📊 Patients:', patients.length);
            console.log('📋 Prescriptions:', prescriptions.length);
            console.log('📦 Inventory items:', inventory.length);
            console.log('💾 All data stored in localStorage');
        })();
    </script>
</body>
</html>
